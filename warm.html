<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>문서 미리 불러오기</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <style>
    /* 행사 전에 한 번 열어 두는 관리용 페이지 (사이트 어디에도 링크 없음) */
    :root { --green: #456d2a; --green-soft: #e9f1e0; --navy: #2d3c85; --ink: #1f2a1a; --muted: #5b6655; --line: #dfe5d8; --bad: #b42318; --paper: #f6f8f3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 "Pretendard Variable", Pretendard, system-ui, sans-serif; word-break: keep-all; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 16px; }
    h1 { margin: 0; color: var(--navy); font-size: 26px; }
    p { margin: 0; }
    .note { padding: 12px 14px; border-radius: 12px; background: var(--green-soft); color: #2f4c1b; font-size: 15px; }
    .bar { height: 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s; }
    .count { font-weight: 700; font-variant-numeric: tabular-nums; }
    ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid var(--line); font-size: 14px; }
    li span:first-child { min-width: 0; overflow-wrap: anywhere; }
    li .s { flex: none; color: var(--muted); font-weight: 600; }
    li.is-ok .s { color: var(--green); }
    li.is-bad { border-color: #f1c4c0; }
    li.is-bad .s { color: var(--bad); }
    button { justify-self: start; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--green); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
<main>
  <h1>문서 미리 불러오기</h1>
  <p class="note">사이트의 모든 PDF·카드뉴스를 미리 받아 서버에 7일 동안 보관해 둡니다. 그러면 방문자가 처음 열어도 기다리지 않아요.
    <b>행사 2~3일 전, 마지막으로 [사이트에 반영하기]를 한 뒤</b> 이 페이지를 열어 끝까지 기다려 주세요. 반영을 또 하면 다시 열어 주세요.</p>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>
  <p class="count" id="count">목록을 읽는 중…</p>
  <button id="again" type="button" hidden>실패한 것만 다시 하기</button>
  <ul id="list"></ul>
</main>
<script>
  (async () => {
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let data;
    try {
      const r = await fetch('assets/data.json', { cache: 'no-cache' });
      if (r.status === 401) { location.reload(); return; }
      data = await r.json();
    } catch (e) {
      $('count').textContent = '자료 목록을 읽지 못했습니다. 새로 고쳐 주세요.';
      return;
    }
    // PDF 자료 + 소개 카드뉴스 (같은 파일은 한 번만)
    const jobs = new Map();
    (data.materials || []).forEach((m) => { if (/^pdf\//.test(m.file || '') && !jobs.has(m.file)) jobs.set(m.file, m.title || m.file); });
    Object.entries(data.intros || {}).forEach(([k, f]) => { if (/^pdf\//.test(f) && !jobs.has(f)) jobs.set(f, `소개 카드뉴스 (${k})`); });
    const items = [...jobs].map(([file, title]) => ({ file, title, state: '대기' }));
    $('list').innerHTML = items.map((it, i) => `<li id="j${i}"><span>${esc(it.title)}</span><span class="s">대기</span></li>`).join('');

    const draw = () => {
      const done = items.filter((x) => x.state === '완료').length;
      const bad = items.filter((x) => x.state === '실패').length;
      $('bar').style.width = `${items.length ? ((done + bad) / items.length) * 100 : 100}%`;
      $('count').textContent = items.length
        ? `${done + bad} / ${items.length}개 · 완료 ${done}${bad ? ` · 실패 ${bad}` : ''}${done + bad === items.length ? (bad ? ' — 실패한 문서는 공유 설정을 확인해 주세요' : ' — 모두 준비됐어요') : ''}`
        : '미리 받을 문서가 없어요.';
    };
    const mark = (i, state) => {
      items[i].state = state;
      const li = $(`j${i}`);
      li.className = state === '완료' ? 'is-ok' : state === '실패' ? 'is-bad' : '';
      li.querySelector('.s').textContent = state;
      draw();
    };

    async function run(list) {
      $('again').hidden = true;
      const queue = list.slice();
      const worker = async () => {
        while (queue.length) {
          const i = queue.shift();
          mark(i, '받는 중…');
          try {
            const r = await fetch(items[i].file, { cache: 'reload' });
            if (!r.ok) throw new Error(String(r.status));
            await r.arrayBuffer();
            mark(i, '완료');
          } catch (e) {
            mark(i, '실패');
          }
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      $('again').hidden = !items.some((x) => x.state === '실패');
    }

    $('again').addEventListener('click', () => run(items.map((x, i) => (x.state === '실패' ? i : -1)).filter((i) => i >= 0)));
    draw();
    run(items.map((_, i) => i));
  })();
</script>
</body>
</html>
